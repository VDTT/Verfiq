<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receber SMS Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; color: #333; }
        
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #1a73e8; font-size: 1.5rem; }
        
        .grid { display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; }
        
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h2 { font-size: 1.1rem; margin-bottom: 10px; color: #666; }
        
        /* Lista de números */
        .number-btn {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border: 1px solid #ddd; border-radius: 6px;
            margin-bottom: 8px; cursor: pointer; background: #fff;
        }
        .number-btn.active { border-color: #1a73e8; background-color: #e8f0fe; font-weight: bold; }
        
        /* Caixa de mensagens */
        .msg-item { background: #f8f9fa; border-left: 4px solid #1a73e8; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .msg-top { display: flex; justify-content: space-between; font-size: 0.8rem; color: #777; margin-bottom: 4px; }
        .msg-sender { font-weight: bold; color: #111; }
        .code { background: #feefae; padding: 2px 5px; border-radius: 3px; font-weight: bold; color: #d93025; }
    </style>
</head>
<body>

    <header>
        <h1>SMS Temporário</h1>
        <p>Escolha um número para ver as mensagens recebidas</p>
    </header>

    <div class="grid">
        <!-- Países -->
        <div class="card">
            <h2>Selecione o País:</h2>
            <div id="lista-numeros"></div>
        </div>

        <!-- Mensagens -->
        <div class="card">
            <h2>Mensagens do Número: <span id="num-atual" style="color: #1a73e8;"></span></h2>
            <div id="lista-mensagens"></div>
        </div>
    </div>

    <script>
        // Dados dos números e suas mensagens fixas
        const dados = [
            {
                id: 1, pais: "🇺🇸 EUA", numero: "+1 (555) 019-2834",
                mensagens: [
                    { remetente: "WhatsApp", hora: "Há 2 min", texto: "Seu código é <span class='code'>482-109</span>" },
                    { remetente: "Google", hora: "Há 15 min", texto: "G-<span class='code'>902184</span> é seu código de verificação." }
                ]
            },
            {
                id: 2, pais: "🇨🇦 Canadá", numero: "+1 (416) 555-0147",
                mensagens: [
                    { remetente: "Telegram", hora: "Há 5 min", texto: "Código de acesso: <span class='code'>59302</span>." },
                    { remetente: "Netflix", hora: "Há 1 hora", texto: "Código para redefinição: <span class='code'>104928</span>" }
                ]
            },
            {
                id: 3, pais: "🇬🇧 Reino Unido", numero: "+44 7700 900077",
                mensagens: [
                    { remetente: "Uber", hora: "Há 10 min", texto: "Seu código Uber é <span class='code'>8821</span>." },
                    { remetente: "Instagram", hora: "Há 30 min", texto: "Use o código <span class='code'>339-102</span> para entrar." }
                ]
            },
            {
                id: 4, pais: "🇧🇷 Brasil", numero: "+55 (11) 98765-4321",
                mensagens: [
                    { remetente: "iFood", hora: "Há 1 min", texto: "Seu código de confirmação é <span class='code'>7402</span>" },
                    { remetente: "WhatsApp", hora: "Há 8 min", texto: "Seu código do WhatsApp: <span class='code'>193-840</span>" }
                ]
            },
            {
                id: 5, pais: "🇫🇷 França", numero: "+33 6 12 34 56 78",
                mensagens: [
                    { remetente: "TikTok", hora: "Há 12 min", texto: "<span class='code'>481920</span> é seu código de verificação." }
                ]
            }
        ];

        let selecionado = 1;

        function render() {
            // Renderiza lista de números
            const divNumeros = document.getElementById('lista-numeros');
            divNumeros.innerHTML = '';
            dados.forEach(item => {
                const btn = document.createElement('div');
                btn.className = `number-btn ${item.id === selecionado ? 'active' : ''}`;
                btn.onclick = () => { selecionado = item.id; render(); };
                btn.innerHTML = `<span>${item.pais}</span> <span>${item.numero}</span>`;
                divNumeros.appendChild(btn);
            });

            // Renderiza mensagens do número selecionado
            const atual = dados.find(d => d.id === selecionado);
            document.getElementById('num-atual').innerText = `${atual.pais} ${atual.numero}`;
            
            const divMsgs = document.getElementById('lista-mensagens');
            divMsgs.innerHTML = '';
            atual.mensagens.forEach(m => {
                const card = document.createElement('div');
                card.className = 'msg-item';
                card.innerHTML = `
                    <div class="msg-top"><span class="msg-sender">${m.remetente}</span><span>${m.hora}</span></div>
                    <div>${m.texto}</div>
                `;
                divMsgs.appendChild(card);
            });
        }

        // Executa ao abrir
        render();
    </script>
</body>
</html>
